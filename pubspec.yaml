name: daily_routine_app
description: Daily Routine Management with Smart Notifications - A Flutter application for organizing daily activities with intelligent reminders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Local Database
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  # API Integration
  http: ^1.2.1
  
  # Date/Time Formatting
  intl: ^0.19.0
  
  # Permission Handler
  permission_handler: ^11.3.1
  
  # Time Picker
  flutter_time_picker_spinner: ^2.0.0
  shared_preferences: ^2.3.4


  android_alarm_manager_plus: ^4.0.4

  
  # UUID Generator
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1  # Add this line

flutter:
  uses-material-design: true
  
  # Add assets here if needed
  # assets:
  #   - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#6C63FF"  # Your brand color
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21